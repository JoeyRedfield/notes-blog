<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 1040">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-slate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
      text {
        font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif;
      }
      .title { fill: #e2e8f0; font-size: 22px; font-weight: 700; }
      .subtitle { fill: #94a3b8; font-size: 10px; }
      .region { fill: none; stroke-width: 1.2; stroke-dasharray: 8 4; }
      .label { fill: #f8fafc; font-size: 12px; font-weight: 600; }
      .sub { fill: #94a3b8; font-size: 9px; }
      .small { fill: #cbd5e1; font-size: 8px; }
      .note { fill: #e2e8f0; font-size: 10px; }
      .edge { fill: none; stroke-width: 2; }
      .legend-title { fill: #f8fafc; font-size: 10px; font-weight: 700; }
      .legend-text { fill: #cbd5e1; font-size: 9px; }
      .chip { fill: rgba(15, 23, 42, 0.95); stroke: #475569; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1540" height="1040" fill="#0f172a"/>
  <rect width="1540" height="1040" fill="url(#grid)"/>

  <text x="36" y="42" class="title">Codex `superpowers` 插件 与 `brainstorming` skill 的关系</text>
  <text x="36" y="62" class="subtitle">这张图描述的是装配/发现/暴露关系，而不是任务执行流程</text>

  <rect x="34" y="92" width="1470" height="840" rx="16" class="region" stroke="#fbbf24"/>
  <text x="52" y="114" fill="#fbbf24" font-size="10" font-weight="700">Codex 本地环境中的技能来源与会话装配</text>

  <rect x="70" y="150" width="430" height="330" rx="14" class="region" stroke="#22d3ee"/>
  <text x="88" y="172" fill="#22d3ee" font-size="10" font-weight="700">A. 插件层</text>

  <rect x="110" y="205" width="350" height="92" rx="8" fill="#0f172a"/>
  <rect x="110" y="205" width="350" height="92" rx="8" fill="rgba(8,51,68,0.40)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="285" y="232" class="label" text-anchor="middle">Codex 插件: `superpowers`</text>
  <text x="285" y="254" class="sub" text-anchor="middle">插件缓存目录</text>
  <text x="285" y="271" class="small" text-anchor="middle">`~/.codex/plugins/cache/openai-curated/superpowers/...`</text>

  <rect x="110" y="332" width="160" height="78" rx="6" fill="#0f172a"/>
  <rect x="110" y="332" width="160" height="78" rx="6" fill="rgba(6,78,59,0.40)" stroke="#34d399" stroke-width="1.5"/>
  <text x="190" y="358" class="label" text-anchor="middle">using-superpowers</text>
  <text x="190" y="378" class="sub" text-anchor="middle">插件内一个 skill</text>
  <text x="190" y="395" class="sub" text-anchor="middle">总控 / 入口规则</text>

  <rect x="300" y="332" width="160" height="78" rx="6" fill="#0f172a"/>
  <rect x="300" y="332" width="160" height="78" rx="6" fill="rgba(6,78,59,0.40)" stroke="#34d399" stroke-width="1.5"/>
  <text x="380" y="358" class="label" text-anchor="middle">brainstorming</text>
  <text x="380" y="378" class="sub" text-anchor="middle">插件内一个 skill</text>
  <text x="380" y="395" class="sub" text-anchor="middle">设计前置流程</text>

  <line x1="285" y1="297" x2="190" y2="332" class="edge" stroke="#22d3ee" marker-end="url(#arrow-cyan)"/>
  <line x1="285" y1="297" x2="380" y2="332" class="edge" stroke="#22d3ee" marker-end="url(#arrow-cyan)"/>

  <rect x="100" y="434" width="360" height="28" rx="8" class="chip"/>
  <text x="280" y="452" class="note" text-anchor="middle">关键点：`superpowers` 是插件包；`brainstorming` 只是它里面的一个 skill。</text>

  <rect x="550" y="150" width="460" height="330" rx="14" class="region" stroke="#34d399"/>
  <text x="548" y="172" fill="#34d399" font-size="10" font-weight="700">B. 本地 skill 镜像层</text>

  <rect x="600" y="205" width="360" height="92" rx="8" fill="#0f172a"/>
  <rect x="600" y="205" width="360" height="92" rx="8" fill="rgba(6,78,59,0.40)" stroke="#34d399" stroke-width="1.5"/>
  <text x="780" y="232" class="label" text-anchor="middle">本地 skills 目录</text>
  <text x="780" y="254" class="sub" text-anchor="middle">`~/.cc-switch/skills/`</text>
  <text x="780" y="271" class="small" text-anchor="middle">你当前会话看到的技能列表主要来自这里</text>

  <rect x="600" y="332" width="165" height="78" rx="6" fill="#0f172a"/>
  <rect x="600" y="332" width="165" height="78" rx="6" fill="rgba(76,29,149,0.40)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="682" y="358" class="label" text-anchor="middle">using-superpowers</text>
  <text x="682" y="378" class="sub" text-anchor="middle">同名副本</text>
  <text x="682" y="395" class="sub" text-anchor="middle">与当前技能列表一致</text>

  <rect x="795" y="332" width="165" height="78" rx="6" fill="#0f172a"/>
  <rect x="795" y="332" width="165" height="78" rx="6" fill="rgba(76,29,149,0.40)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="877" y="358" class="label" text-anchor="middle">brainstorming</text>
  <text x="877" y="378" class="sub" text-anchor="middle">同名副本</text>
  <text x="877" y="395" class="sub" text-anchor="middle">内容与插件缓存一致</text>

  <line x1="780" y1="297" x2="682" y2="332" class="edge" stroke="#34d399" marker-end="url(#arrow-emerald)"/>
  <line x1="780" y1="297" x2="877" y2="332" class="edge" stroke="#34d399" marker-end="url(#arrow-emerald)"/>

  <path d="M 460 368 C 505 368, 545 368, 600 368" class="edge" stroke="#94a3b8" stroke-dasharray="6 4" marker-end="url(#arrow-slate)"/>
  <rect x="445" y="336" width="170" height="24" rx="8" class="chip"/>
  <text x="530" y="352" class="small" text-anchor="middle">插件 skill 的本地镜像副本</text>

  <rect x="1050" y="150" width="410" height="330" rx="14" class="region" stroke="#a78bfa"/>
  <text x="1038" y="172" fill="#a78bfa" font-size="10" font-weight="700">C. 会话暴露层</text>

  <rect x="1090" y="205" width="330" height="92" rx="8" fill="#0f172a"/>
  <rect x="1090" y="205" width="330" height="92" rx="8" fill="rgba(76,29,149,0.40)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="1255" y="232" class="label" text-anchor="middle">当前会话可见的 Skills 列表</text>
  <text x="1255" y="254" class="sub" text-anchor="middle">由 Codex 在会话启动时暴露给模型</text>
  <text x="1255" y="271" class="small" text-anchor="middle">这一层决定模型此刻能调用哪些 skill</text>

  <rect x="1110" y="332" width="135" height="62" rx="6" fill="#0f172a"/>
  <rect x="1110" y="332" width="135" height="62" rx="6" fill="rgba(30,41,59,0.50)" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="1177" y="357" class="label" text-anchor="middle">using-superpowers</text>
  <text x="1177" y="378" class="sub" text-anchor="middle">可见</text>

  <rect x="1278" y="332" width="135" height="62" rx="6" fill="#0f172a"/>
  <rect x="1278" y="332" width="135" height="62" rx="6" fill="rgba(30,41,59,0.50)" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="1345" y="357" class="label" text-anchor="middle">brainstorming</text>
  <text x="1345" y="378" class="sub" text-anchor="middle">可见</text>

  <path d="M 960 368 C 1005 368, 1045 368, 1090 368" class="edge" stroke="#a78bfa" marker-end="url(#arrow-violet)"/>
  <rect x="955" y="336" width="170" height="24" rx="8" class="chip"/>
  <text x="1040" y="352" class="small" text-anchor="middle">Codex 暴露选定来源的 skills</text>

  <rect x="70" y="530" width="1390" height="240" rx="14" class="region" stroke="#fb7185"/>
  <text x="88" y="542" fill="#fb7185" font-size="10" font-weight="700">D. 运行时选择关系</text>

  <rect x="120" y="586" width="220" height="74" rx="8" fill="#0f172a"/>
  <rect x="120" y="586" width="220" height="74" rx="8" fill="rgba(136,19,55,0.40)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="230" y="612" class="label" text-anchor="middle">用户提问 / 当前任务</text>
  <text x="230" y="632" class="sub" text-anchor="middle">例如：问流程、做设计、写功能</text>
  <text x="230" y="648" class="sub" text-anchor="middle">先进入技能匹配判断</text>

  <rect x="420" y="586" width="260" height="74" rx="8" fill="#0f172a"/>
  <rect x="420" y="586" width="260" height="74" rx="8" fill="rgba(8,51,68,0.40)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="550" y="612" class="label" text-anchor="middle">若匹配到 `using-superpowers`</text>
  <text x="550" y="632" class="sub" text-anchor="middle">它要求先检查还有哪些 skill 适用</text>
  <text x="550" y="648" class="sub" text-anchor="middle">并优先 process skills</text>

  <rect x="760" y="586" width="260" height="74" rx="8" fill="#0f172a"/>
  <rect x="760" y="586" width="260" height="74" rx="8" fill="rgba(6,78,59,0.40)" stroke="#34d399" stroke-width="1.5"/>
  <text x="890" y="612" class="label" text-anchor="middle">若任务属于创作/设计改动</text>
  <text x="890" y="632" class="sub" text-anchor="middle">就继续触发 `brainstorming`</text>
  <text x="890" y="648" class="sub" text-anchor="middle">进入它定义的工作流</text>

  <rect x="1100" y="586" width="310" height="74" rx="8" fill="#0f172a"/>
  <rect x="1100" y="586" width="310" height="74" rx="8" fill="rgba(76,29,149,0.40)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="1255" y="612" class="label" text-anchor="middle">所以两者不是冲突关系</text>
  <text x="1255" y="632" class="sub" text-anchor="middle">而是“先进入技能系统，再触发其中具体 skill”</text>
  <text x="1255" y="648" class="sub" text-anchor="middle">常见链路：`using-superpowers` → `brainstorming`</text>

  <line x1="340" y1="623" x2="420" y2="623" class="edge" stroke="#fb7185" marker-end="url(#arrow-rose)"/>
  <line x1="680" y1="623" x2="760" y2="623" class="edge" stroke="#22d3ee" marker-end="url(#arrow-cyan)"/>
  <line x1="1020" y1="623" x2="1100" y2="623" class="edge" stroke="#34d399" marker-end="url(#arrow-emerald)"/>

  <rect x="70" y="800" width="1390" height="120" rx="14" class="region" stroke="#94a3b8"/>
  <text x="88" y="812" fill="#94a3b8" font-size="10" font-weight="700">一句话总结</text>

  <rect x="110" y="840" width="1310" height="44" rx="8" fill="rgba(15,23,42,0.88)" stroke="#334155" stroke-width="1"/>
  <text x="765" y="859" class="note" text-anchor="middle">`superpowers` 是插件包；`brainstorming` 是其中一个 skill。</text>
  <text x="765" y="874" class="note" text-anchor="middle">你本地 `.cc-switch/skills` 里还有同内容副本；当前会话主要暴露的是这套本地 skills。</text>

  <rect x="84" y="962" width="1360" height="28" rx="8" fill="rgba(15,23,42,0.88)" stroke="#334155" stroke-width="1"/>
  <text x="104" y="940" class="legend-title">配色</text>
  <text x="168" y="940" class="legend-text">青色：插件层</text>
  <text x="290" y="940" class="legend-text">绿色：本地副本层</text>
  <text x="450" y="940" class="legend-text">紫色：会话暴露层</text>
  <text x="612" y="940" class="legend-text">粉色：运行时选择关系</text>
  <text x="842" y="940" class="legend-text">灰色虚线：镜像/同步关系</text>
</svg>
