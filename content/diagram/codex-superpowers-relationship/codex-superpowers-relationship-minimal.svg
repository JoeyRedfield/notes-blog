<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520">
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-slate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
      text {
        font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif;
      }
      .title { fill: #e2e8f0; font-size: 18px; font-weight: 700; }
      .subtitle { fill: #94a3b8; font-size: 10px; }
      .label { fill: #f8fafc; font-size: 12px; font-weight: 600; }
      .sub { fill: #94a3b8; font-size: 9px; }
      .note { fill: #e2e8f0; font-size: 10px; }
      .edge { fill: none; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1180" height="520" fill="#0f172a"/>
  <rect width="1180" height="520" fill="url(#grid)"/>

  <text x="32" y="38" class="title">Codex `superpowers` 与 `brainstorming` 极简关系图</text>
  <text x="32" y="58" class="subtitle">只回答一个问题：插件和 skill 到底是什么关系</text>

  <rect x="50" y="110" width="220" height="110" rx="10" fill="#0f172a"/>
  <rect x="50" y="110" width="220" height="110" rx="10" fill="rgba(8,51,68,0.40)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="160" y="142" class="label" text-anchor="middle">1. `superpowers` 插件</text>
  <text x="160" y="166" class="sub" text-anchor="middle">插件 / 技能包</text>
  <text x="160" y="184" class="sub" text-anchor="middle">内部包含多个 skills</text>

  <rect x="340" y="110" width="220" height="110" rx="10" fill="#0f172a"/>
  <rect x="340" y="110" width="220" height="110" rx="10" fill="rgba(6,78,59,0.40)" stroke="#34d399" stroke-width="1.5"/>
  <text x="450" y="142" class="label" text-anchor="middle">2. 插件里的 skills</text>
  <text x="450" y="166" class="sub" text-anchor="middle">如 `using-superpowers`</text>
  <text x="450" y="184" class="sub" text-anchor="middle">和 `brainstorming`</text>

  <rect x="630" y="110" width="220" height="110" rx="10" fill="#0f172a"/>
  <rect x="630" y="110" width="220" height="110" rx="10" fill="rgba(76,29,149,0.40)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="740" y="142" class="label" text-anchor="middle">3. 本地副本 / 镜像</text>
  <text x="740" y="166" class="sub" text-anchor="middle">`~/.cc-switch/skills/`</text>
  <text x="740" y="184" class="sub" text-anchor="middle">这台机器当前主要从这里暴露</text>

  <rect x="920" y="110" width="220" height="110" rx="10" fill="#0f172a"/>
  <rect x="920" y="110" width="220" height="110" rx="10" fill="rgba(136,19,55,0.40)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="1030" y="142" class="label" text-anchor="middle">4. 当前会话可见 skills</text>
  <text x="1030" y="166" class="sub" text-anchor="middle">模型只能调用这一层</text>
  <text x="1030" y="184" class="sub" text-anchor="middle">再按触发规则选 skill</text>

  <line x1="270" y1="165" x2="340" y2="165" class="edge" stroke="#22d3ee" marker-end="url(#arrow-slate)"/>
  <line x1="560" y1="165" x2="630" y2="165" class="edge" stroke="#34d399" marker-end="url(#arrow-slate)"/>
  <line x1="850" y1="165" x2="920" y2="165" class="edge" stroke="#a78bfa" marker-end="url(#arrow-slate)"/>

  <rect x="100" y="300" width="980" height="110" rx="12" fill="rgba(15,23,42,0.92)" stroke="#475569" stroke-width="1.2"/>
  <text x="590" y="332" class="label" text-anchor="middle">一句话结论</text>
  <text x="590" y="360" class="note" text-anchor="middle">`brainstorming` 不是和 `superpowers` 插件平级竞争的东西。</text>
  <text x="590" y="382" class="note" text-anchor="middle">它是 `superpowers` 这个插件包里的一个具体 skill；在你这台机器上，又有一份本地副本被当前会话优先暴露。</text>

  <rect x="220" y="448" width="740" height="30" rx="8" fill="rgba(15,23,42,0.88)" stroke="#334155" stroke-width="1"/>
  <text x="590" y="468" class="sub" text-anchor="middle">常见运行链路：用户任务 → 命中 `using-superpowers` → 再触发 `brainstorming`</text>
</svg>
